<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kōra — drink studies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#faf8f3; --ink:#111; --ink-soft:#4a4a46;
    --green:#2f4a35; --line:#e0dacd;
    --serif:"Fraunces",Georgia,serif;
    --sans:"Inter",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-weight:300}
  header{padding:clamp(3rem,8vw,5rem) clamp(1.25rem,5vw,3.5rem) 2rem;max-width:1200px;margin:0 auto}
  .glyph{display:inline-flex;align-items:center;justify-content:center;width:2.15rem;height:2.15rem;
    background:#fff;color:var(--ink);border:1px solid var(--ink);font-family:var(--serif);
    font-size:1.35rem;line-height:1;padding-bottom:.28em}
  h1{font-family:var(--serif);font-weight:300;font-size:clamp(2rem,5vw,3rem);margin:1.25rem 0 .5rem;letter-spacing:-.01em}
  .sub{color:var(--ink-soft);margin:0;max-width:52ch}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:clamp(1.5rem,3vw,2.5rem);
    max-width:1200px;margin:0 auto;padding:2rem clamp(1.25rem,5vw,3.5rem) 5rem}
  figure{margin:0}
  figure svg{width:100%;height:auto;display:block;border:1px solid var(--line)}
  figcaption{padding:1rem .2rem 0}
  figcaption h2{font-family:var(--serif);font-weight:400;font-size:1.1rem;margin:0 0 .3rem}
  figcaption p{margin:0;font-size:.88rem;color:var(--ink-soft);line-height:1.55}
</style>
</head>
<body>

<header>
  <span class="glyph">ō</span>
  <h1>Drink studies</h1>
  <p class="sub">Six menu items, drawn as studio compositions. Vector — so they stay
  sharp at any size, print or screen, and weigh a few kilobytes each.</p>
</header>

<div class="grid">

<!-- ============ 1. COLD BREW — pour in motion ============ -->
<figure>
<svg viewBox="0 0 600 780" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cold brew coffee in a kōra cup with coffee pouring in">
  <defs>
    <linearGradient id="bg-cb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfdcc4"/><stop offset="1" stop-color="#a8bd9c"/>
    </linearGradient>
    <radialGradient id="glow-cb" cx="50%" cy="38%" r="62%">
      <stop offset="0" stop-color="#f2f7ec" stop-opacity=".85"/>
      <stop offset="1" stop-color="#f2f7ec" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="liq-cb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b4126"/><stop offset=".35" stop-color="#40220f"/>
      <stop offset="1" stop-color="#24120a"/>
    </linearGradient>
    <linearGradient id="foam-cb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8d3b6"/><stop offset="1" stop-color="#c9a274"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".05"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".3"/>
    </linearGradient>
    <clipPath id="cup-cb"><path d="M165 214 L435 214 L387 676 Q385 692 369 692 L231 692 Q215 692 213 676 Z"/></clipPath>
    <filter id="soft-cb" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="blur-sm-cb" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="600" height="780" fill="url(#bg-cb)"/>
  <rect width="600" height="780" fill="url(#glow-cb)"/>
  <ellipse cx="300" cy="706" rx="150" ry="22" fill="#2b3a24" opacity=".28" filter="url(#soft-cb)"/>

  <!-- pouring stream -->
  <path d="M300 0 C296 60 306 110 302 168 C300 190 300 196 300 214"
        stroke="#3c1f0e" stroke-width="17" fill="none" stroke-linecap="round" opacity=".92"/>
  <path d="M296 0 C292 60 302 110 298 168" stroke="#7a4a29" stroke-width="4" fill="none" opacity=".55"/>

  <!-- cup body -->
  <g clip-path="url(#cup-cb)">
    <rect x="150" y="214" width="300" height="480" fill="#e9eee4" opacity=".55"/>
    <rect x="150" y="300" width="300" height="394" fill="url(#liq-cb)"/>
    <rect x="150" y="292" width="300" height="26" fill="url(#foam-cb)" opacity=".95"/>
    <ellipse cx="300" cy="296" rx="150" ry="16" fill="#f0dcc0" opacity=".9"/>
    <!-- ice -->
    <g opacity=".3">
      <rect x="212" y="340" width="72" height="66" rx="12" fill="#fff" transform="rotate(-14 248 373)"/>
      <rect x="308" y="372" width="66" height="62" rx="12" fill="#fff" transform="rotate(18 341 403)"/>
      <rect x="240" y="452" width="80" height="70" rx="13" fill="#fff" transform="rotate(8 280 487)"/>
      <rect x="318" y="500" width="60" height="56" rx="11" fill="#fff" transform="rotate(-22 348 528)"/>
      <rect x="216" y="560" width="66" height="60" rx="12" fill="#fff" transform="rotate(26 249 590)"/>
    </g>
    <rect x="165" y="214" width="26" height="480" fill="url(#shine)" opacity=".5"/>
    <rect x="404" y="214" width="14" height="480" fill="#fff" opacity=".22"/>
  </g>
  <path d="M165 214 L435 214 L387 676 Q385 692 369 692 L231 692 Q215 692 213 676 Z"
        fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="2.5"/>

  <!-- lid -->
  <path d="M156 190 L444 190 L438 216 L162 216 Z" fill="#f4f6f0" opacity=".95"/>
  <path d="M156 190 L444 190 L441 199 L159 199 Z" fill="#fff" opacity=".8"/>

  <!-- crema ripple rings where the stream lands -->
  <g fill="none" stroke="#8a5a33" opacity=".5">
    <ellipse cx="300" cy="298" rx="34" ry="7" stroke-width="3"/>
    <ellipse cx="300" cy="300" rx="62" ry="11" stroke-width="2" opacity=".7"/>
    <ellipse cx="300" cy="302" rx="94" ry="14" stroke-width="1.5" opacity=".45"/>
  </g>
  <!-- flying droplets outside cup -->
  <g opacity=".6" filter="url(#blur-sm-cb)">
    <circle cx="176" cy="250" r="6" fill="#3c1f0e"/>
    <circle cx="432" cy="232" r="5" fill="#3c1f0e"/>
    <circle cx="150" cy="330" r="4" fill="#3c1f0e"/>
  </g>

  <!-- logo -->
  <g transform="translate(300 450)">
    <rect x="-52" y="-52" width="104" height="104" fill="#fff" stroke="#111" stroke-width="3"/>
    <text x="0" y="26" font-family="Georgia,serif" font-size="76" fill="#111" text-anchor="middle">ō</text>
  </g>
  <!-- condensation -->
  <g fill="#fff" opacity=".4">
    <circle cx="196" cy="420" r="3.5"/><circle cx="205" cy="500" r="2.5"/>
    <circle cx="392" cy="380" r="3"/><circle cx="386" cy="470" r="2.5"/>
    <circle cx="222" cy="620" r="3"/><circle cx="372" cy="600" r="2.5"/>
  </g>
</svg>
<figcaption><h2>Cold Brew</h2><p>Smooth, slow-steeped 18-hour cold brew coffee over ice.</p></figcaption>
</figure>

<!-- ============ 2. STRAWBERRY MATCHA LATTE — layered ============ -->
<figure>
<svg viewBox="0 0 600 780" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Strawberry matcha latte with layered pink, milk and green">
  <defs>
    <linearGradient id="bg-sm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d9dd"/><stop offset="1" stop-color="#cbd9c0"/>
    </linearGradient>
    <radialGradient id="glow-sm" cx="50%" cy="34%" r="60%">
      <stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="matcha-sm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fb96a"/><stop offset="1" stop-color="#5f8f43"/>
    </linearGradient>
    <linearGradient id="milk-sm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf8"/><stop offset="1" stop-color="#f3ece0"/>
    </linearGradient>
    <linearGradient id="straw-sm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8677f"/><stop offset="1" stop-color="#c33d5a"/>
    </linearGradient>
    <clipPath id="cup-sm"><path d="M165 214 L435 214 L387 676 Q385 692 369 692 L231 692 Q215 692 213 676 Z"/></clipPath>
    <filter id="soft-sm" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <rect width="600" height="780" fill="url(#bg-sm)"/>
  <rect width="600" height="780" fill="url(#glow-sm)"/>
  <ellipse cx="300" cy="706" rx="150" ry="22" fill="#6b4550" opacity=".25" filter="url(#soft-sm)"/>

  <g clip-path="url(#cup-sm)">
    <rect x="150" y="214" width="300" height="480" fill="#fff" opacity=".5"/>
    <rect x="150" y="520" width="300" height="174" fill="url(#straw-sm)"/>
    <rect x="150" y="382" width="300" height="146" fill="url(#milk-sm)"/>
    <rect x="150" y="240" width="300" height="146" fill="url(#matcha-sm)"/>
    <!-- feathered boundaries -->
    <ellipse cx="300" cy="386" rx="150" ry="20" fill="#c9dbb3" opacity=".8"/>
    <ellipse cx="300" cy="524" rx="150" ry="20" fill="#f0b6c0" opacity=".85"/>
    <g opacity=".28">
      <rect x="218" y="286" width="70" height="64" rx="12" fill="#fff" transform="rotate(-16 253 318)"/>
      <rect x="312" y="320" width="62" height="58" rx="11" fill="#fff" transform="rotate(20 343 349)"/>
      <rect x="236" y="410" width="76" height="66" rx="12" fill="#fff" transform="rotate(10 274 443)"/>
      <rect x="322" y="560" width="58" height="54" rx="11" fill="#fff" transform="rotate(-24 351 587)"/>
    </g>
    <rect x="165" y="214" width="26" height="480" fill="url(#shine)" opacity=".55"/>
    <rect x="404" y="214" width="14" height="480" fill="#fff" opacity=".25"/>
  </g>
  <path d="M165 214 L435 214 L387 676 Q385 692 369 692 L231 692 Q215 692 213 676 Z"
        fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2.5"/>

  <!-- dome lid + straw -->
  <path d="M158 214 Q300 118 442 214 Z" fill="#fff" opacity=".4"/>
  <path d="M158 214 Q300 118 442 214" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="3"/>
  <g transform="rotate(12 300 160)">
    <rect x="286" y="60" width="28" height="180" rx="7" fill="#3f5140" opacity=".9"/>
    <rect x="292" y="60" width="8" height="180" fill="#fff" opacity=".25"/>
  </g>

  <!-- matcha dust falling -->
  <g fill="#6f9c4d" opacity=".55">
    <circle cx="212" cy="120" r="4"/><circle cx="246" cy="72" r="3"/>
    <circle cx="382" cy="98" r="3.5"/><circle cx="414" cy="150" r="3"/>
    <circle cx="176" cy="188" r="2.5"/><circle cx="440" cy="206" r="2.5"/>
  </g>

  <g transform="translate(300 452)">
    <rect x="-52" y="-52" width="104" height="104" fill="#fff" stroke="#111" stroke-width="3"/>
    <text x="0" y="26" font-family="Georgia,serif" font-size="76" fill="#111" text-anchor="middle">ō</text>
  </g>
  <g fill="#fff" opacity=".45">
    <circle cx="198" cy="440" r="3.5"/><circle cx="208" cy="530" r="2.5"/>
    <circle cx="390" cy="410" r="3"/><circle cx="380" cy="520" r="2.5"/>
  </g>
</svg>
<figcaption><h2>Strawberry Matcha Latte</h2><p>Earthy ceremonial matcha layered over cold milk and rich strawberry purée.</p></figcaption>
</figure>

<!-- ============ 3. COCONUT MATCHA — swirl in motion ============ -->
<figure>
<svg viewBox="0 0 600 780" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Coconut matcha latte with swirling milk">
  <defs>
    <linearGradient id="bg-cm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dfe9d3"/><stop offset="1" stop-color="#b3c8a4"/>
    </linearGradient>
    <radialGradient id="glow-cm" cx="46%" cy="32%" r="58%">
      <stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="liq-cm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a6c983"/><stop offset=".55" stop-color="#7fae5c"/>
      <stop offset="1" stop-color="#e9f0e0"/>
    </linearGradient>
    <clipPath id="cup-cm"><path d="M165 214 L435 214 L387 676 Q385 692 369 692 L231 692 Q215 692 213 676 Z"/></clipPath>
    <filter id="soft-cm" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="swirl-cm" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>

  <rect width="600" height="780" fill="url(#bg-cm)"/>
  <rect width="600" height="780" fill="url(#glow-cm)"/>
  <ellipse cx="300" cy="706" rx="150" ry="22" fill="#3f5b31" opacity=".25" filter="url(#soft-cm)"/>

  <g clip-path="url(#cup-cm)">
    <rect x="150" y="214" width="300" height="480" fill="#fff" opacity=".5"/>
    <rect x="150" y="252" width="300" height="442" fill="url(#liq-cm)"/>
    <!-- coconut milk swirls -->
    <g filter="url(#swirl-cm)" opacity=".85">
      <path d="M170 470 C240 420 300 540 370 470 C410 432 430 470 440 500 L440 560 C380 600 320 520 250 566 C210 592 180 560 168 528 Z" fill="#fdfaf3"/>
      <path d="M180 350 C240 316 268 392 330 356 C368 334 400 356 420 380" stroke="#fdfaf3" stroke-width="20" fill="none" opacity=".85" stroke-linecap="round"/>
      <path d="M196 620 C250 590 300 648 360 616" stroke="#fdfaf3" stroke-width="16" fill="none" opacity=".7" stroke-linecap="round"/>
    </g>
    <ellipse cx="300" cy="256" rx="150" ry="17" fill="#c3dda6" opacity=".95"/>
    <g opacity=".26">
      <rect x="222" y="300" width="68" height="62" rx="12" fill="#fff" transform="rotate(-18 256 331)"/>
      <rect x="316" y="342" width="60" height="56" rx="11" fill="#fff" transform="rotate(22 346 370)"/>
    </g>
    <rect x="165" y="214" width="26" height="480" fill="url(#shine)" opacity=".55"/>
    <rect x="404" y="214" width="14" height="480" fill="#fff" opacity=".25"/>
  </g>
  <path d="M165 214 L435 214 L387 676 Q385 692 369 692 L231 692 Q215 692 213 676 Z"
        fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2.5"/>

  <path d="M156 190 L444 190 L438 216 L162 216 Z" fill="#f4f6f0" opacity=".95"/>
  <path d="M156 190 L444 190 L441 199 L159 199 Z" fill="#fff" opacity=".8"/>

  <!-- whisk motion arcs above -->
  <g stroke="#7fae5c" fill="none" opacity=".5" stroke-linecap="round">
    <path d="M204 150 q96 -54 192 0" stroke-width="5"/>
    <path d="M228 116 q72 -40 144 0" stroke-width="4" opacity=".7"/>
    <path d="M252 84 q48 -26 96 0" stroke-width="3" opacity=".5"/>
  </g>

  <g transform="translate(300 452)">
    <rect x="-52" y="-52" width="104" height="104" fill="#fff" stroke="#111" stroke-width="3"/>
    <text x="0" y="26" font-family="Georgia,serif" font-size="76" fill="#111" text-anchor="middle">ō</text>
  </g>
  <g fill="#fff" opacity=".45">
    <circle cx="200" cy="430" r="3.5"/><circle cx="206" cy="516" r="2.5"/>
    <circle cx="392" cy="404" r="3"/><circle cx="382" cy="512" r="2.5"/>
  </g>
</svg>
<figcaption><h2>Coconut Matcha Latte</h2><p>Creamy coconut milk blended with whisked Japanese green matcha.</p></figcaption>
</figure>

<!-- ============ 4. BUTTERFLY LIME SODA — colour change + splash ============ -->
<figure>
<svg viewBox="0 0 600 780" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Butterfly pea lime soda changing colour from blue to purple with a lime wheel dropping in">
  <defs>
    <linearGradient id="bg-bl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbe4f0"/><stop offset="1" stop-color="#b6c3dd"/>
    </linearGradient>
    <radialGradient id="glow-bl" cx="50%" cy="30%" r="60%">
      <stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="liq-bl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f6fd0"/><stop offset=".42" stop-color="#5a4fc0"/>
      <stop offset=".74" stop-color="#9b3fae"/><stop offset="1" stop-color="#d24f8e"/>
    </linearGradient>
    <clipPath id="cup-bl"><path d="M165 214 L435 214 L387 676 Q385 692 369 692 L231 692 Q215 692 213 676 Z"/></clipPath>
    <filter id="soft-bl" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <rect width="600" height="780" fill="url(#bg-bl)"/>
  <rect width="600" height="780" fill="url(#glow-bl)"/>
  <ellipse cx="300" cy="706" rx="150" ry="22" fill="#3b3363" opacity=".28" filter="url(#soft-bl)"/>

  <g clip-path="url(#cup-bl)">
    <rect x="150" y="214" width="300" height="480" fill="#fff" opacity=".45"/>
    <rect x="150" y="268" width="300" height="426" fill="url(#liq-bl)"/>
    <ellipse cx="300" cy="272" rx="150" ry="17" fill="#5f8fe0" opacity=".9"/>
    <!-- bubbles rising -->
    <g fill="#fff" opacity=".5">
      <circle cx="228" cy="600" r="5"/><circle cx="252" cy="540" r="3.5"/>
      <circle cx="238" cy="470" r="4.5"/><circle cx="264" cy="404" r="3"/>
      <circle cx="344" cy="620" r="4"/><circle cx="362" cy="548" r="5"/>
      <circle cx="348" cy="486" r="3"/><circle cx="368" cy="416" r="4"/>
      <circle cx="300" cy="580" r="3.5"/><circle cx="308" cy="500" r="4.5"/>
      <circle cx="296" cy="430" r="3"/>
    </g>
    <g opacity=".26">
      <rect x="216" y="316" width="70" height="64" rx="12" fill="#fff" transform="rotate(-15 251 348)"/>
      <rect x="316" y="356" width="62" height="58" rx="11" fill="#fff" transform="rotate(21 347 385)"/>

  <path d="M165 214 L435 214 L387 676 Q385 692 369 692 L231 692 Q215 692 213 676 Z"
        fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="2.5"/>

  <!-- lime wheel dropping + splash -->
  <g transform="translate(348 148) rotate(-18)">
    <circle r="42" fill="#c8e06a"/><circle r="36" fill="#e4f3a6"/>
    <g stroke="#a9c94e" stroke-width="2.5">
      <line x1="0" y1="-34" x2="0" y2="34"/><line x1="-34" y1="0" x2="34" y2="0"/>
      <line x1="-24" y1="-24" x2="24" y2="24"/><line x1="-24" y1="24" x2="24" y2="-24"/>
    </g>
    <circle r="6" fill="#d6ea8c"/>
  </g>
  <!-- ripple where the wheel breaks the surface, plus thrown droplets -->
  <g fill="none" stroke="#7f6fd8" opacity=".55">
    <ellipse cx="332" cy="268" rx="30" ry="6" stroke-width="3"/>
    <ellipse cx="332" cy="270" rx="58" ry="10" stroke-width="2" opacity=".7"/>
    <ellipse cx="332" cy="272" rx="88" ry="13" stroke-width="1.5" opacity=".45"/>
  </g>
  <g fill="#5a4fc0" opacity=".8">
    <circle cx="392" cy="222" r="7"/>
    <circle cx="424" cy="256" r="4.5"/>
    <circle cx="268" cy="238" r="5"/>
  </g>

  <g transform="translate(300 452)">
    <rect x="-52" y="-52" width="104" height="104" fill="#fff" stroke="#111" stroke-width="3"/>
    <text x="0" y="26" font-family="Georgia,serif" font-size="76" fill="#111" text-anchor="middle">ō</text>
  </g>
  <g fill="#fff" opacity=".45">
    <circle cx="198" cy="430" r="3.5"/><circle cx="206" cy="518" r="2.5"/>
    <circle cx="392" cy="400" r="3"/><circle cx="384" cy="516" r="2.5"/>
  </g>
</svg>
<figcaption><h2>Butterfly Lime Soda</h2><p>Colour-changing floral butterfly pea tea layered over zesty lime soda.</p></figcaption>
</figure>

<!-- ============ 5. ABC JUICE — bottle + glass ============ -->
<figure>
<svg viewBox="0 0 600 780" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ABC cold pressed juice of apple beetroot and carrot">
  <defs>
    <linearGradient id="bg-ab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0dcd8"/><stop offset="1" stop-color="#cdb3ae"/>
    </linearGradient>
    <radialGradient id="glow-ab" cx="50%" cy="32%" r="58%">
      <stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="liq-ab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b52a4e"/><stop offset=".5" stop-color="#8e1b3c"/>
      <stop offset="1" stop-color="#5e0f28"/>
    </linearGradient>
    <clipPath id="cup-ab"><path d="M165 214 L435 214 L387 676 Q385 692 369 692 L231 692 Q215 692 213 676 Z"/></clipPath>
    <filter id="soft-ab" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="14"/></filter>
