<style>
  /* Fraunces' stock latin-ext subset misplaces the macron in U+014D, rendering
     "kōra" as "koṟa". This 2 KB single-codepoint subset supplies a correct ō.
     Own family name, first in --serif, so it always wins. Mirrors styles.css. */
  @font-face{
    font-family:"Kora Macron";font-style:normal;font-weight:300 500;font-display:swap;
    src:url("fonts/fraunces-omacron.woff2") format("woff2");unicode-range:U+014D;
  }
  @font-face{
    font-family:"Kora Macron";font-style:italic;font-weight:300 500;font-display:swap;
    src:url("fonts/fraunces-omacron.woff2") format("woff2");unicode-range:U+014D;
  }
  :root{
    --paper:#faf8f3; --ink:#111; --ink-soft:#4a4a46;
    --green:#2f4a35; --line:#e6e2d8;
    --serif:"Kora Macron","Fraunces",Georgia,serif;
    --sans:"Inter",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-weight:300}
  header{padding:clamp(3rem,8vw,5rem) clamp(1.25rem,5vw,3.5rem) 2rem;max-width:1200px;margin:0 auto}
  .glyph{display:block;width:2.6rem;height:2.6rem;flex:none}
  .mark{display:inline-flex;align-items:center;gap:.6rem;text-decoration:none;color:var(--ink)}
  .wordmark{font-family:var(--serif);font-weight:400;letter-spacing:.02em;font-size:1.4rem}
  .wordmark .o{font-style:normal}
  .back{max-width:1200px;margin:0 auto;padding:0 clamp(1.25rem,5vw,3.5rem) 5rem}
  .back a{color:var(--green);text-decoration:none;font-size:.78rem;letter-spacing:.14em;
    text-transform:uppercase;border-bottom:1px solid transparent;padding-bottom:2px}
  .back a:hover{border-bottom-color:var(--green)}
  h1{font-family:var(--serif);font-weight:300;font-size:clamp(2rem,5vw,3rem);margin:1.25rem 0 .5rem;letter-spacing:-.01em}
  .sub{color:var(--ink-soft);margin:0;max-width:54ch;line-height:1.6}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(1.5rem,3vw,2.5rem);
    max-width:1200px;margin:0 auto;padding:2rem clamp(1.25rem,5vw,3.5rem) 5rem}
  figure{margin:0}
  figure svg{width:100%;height:auto;display:block;border:1px solid var(--line);background:#fff}
  figcaption{padding:1rem .2rem 0}
  figcaption .cat{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--green);margin:0 0 .4rem}
  figcaption h2{font-family:var(--serif);font-weight:400;font-size:1.1rem;margin:0 0 .3rem}
  figcaption p{margin:0;font-size:.88rem;color:var(--ink-soft);line-height:1.55}
</style>
</head>
